[project]
name = "grant_proposal_assistant"
version = "0.1.0"
description = "grant-proposal-assistant using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4",
    "streamlit>=1.57.0",
]

[project.scripts]
grant_proposal_assistant = "grant_proposal_assistant.main:run"
run_crew = "grant_proposal_assistant.main:run"
train = "grant_proposal_assistant.main:train"
replay = "grant_proposal_assistant.main:replay"
test = "grant_proposal_assistant.main:test"
run_with_trigger = "grant_proposal_assistant.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
